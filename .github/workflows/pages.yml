name: Presentation site

# The site at https://caelis-app.com is built from site/ by scripts/build_site.py (standard library
# only, nothing installed) and deployed to GitHub Pages. The output is never committed, so it cannot
# drift from its source. Pull requests check that it builds; `main` deploys.
# The custom domain lives in Settings → Pages: a deploy from Actions ignores a CNAME file.
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# A newer deploy replaces an older one, but one in progress is never cut off halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the privacy policy's "last updated" is read from git (scripts/build_site.py).
          fetch-depth: 0

      - name: Build
        run: python3 scripts/build_site.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Only this job may publish, and only through the Pages OIDC token; it checks out no code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
